<style>
/* VOICE  절제. 작업 이미지와 작은 활자가 주인공
   IDEA   명함 네 장처럼, 페이지마다 명함 한 장의 색과 표정을 입는다
          Work = 흰색 / 작품 = 검정 / About = 초록(민트) / Contact = 핑크 명함
   TYPE   Adobe Fonts 윤굴림 750(500) 한 굵기, 위계는 크기와 색으로. 키트가 안 뜨면 Gothic A1
   LAYOUT 데스크톱 12단 / 모바일 4단, 넓은 바깥 여백 */
:root{--font:"yoon-gulim-750","Gothic A1",system-ui,sans-serif;--w:500;
  --pad:clamp(24px,7vw,120px);--gap:20px}
/* 페이지별 색 (명함 PDF에서 추출, 화면용 보정) */
body[data-theme=pink]{--bg:#f03a9a;--ink:#10281a;--dim:#10281a;--line:rgba(16,40,26,.28);--ac:#10281a;--hover:rgba(16,40,26,.06)}
body[data-theme=black]{--bg:#0d0d0d;--ink:#ededed;--dim:#8f8f8f;--line:#262626;--ac:#93d897;--hover:#151515}
/* 민트: 글자는 핑크 한 가지. 명함 핑크(#f03a9a)는 민트 위에서 너무 흐려 한 톤만 짙게 */
/* 민트: 글자는 진한 쨍핑크 한 가지(민트 위에서 읽히도록 명함 핑크보다 한 톤 짙게) */
body[data-theme=mint]{--bg:#9eddba;--ink:#bd006c;--dim:#bd006c;--line:rgba(189,0,108,.35);--ac:#bd006c;--hover:rgba(189,0,108,.05)}
body[data-theme=white]{--bg:#ffffff;--ink:#231f20;--dim:#231f20;--line:#e0e0e0;--ac:#231f20;--hover:#f6f6f6}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--w) 13px/1.7 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible,button:focus-visible,tr:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
h1,h2,h3,h4{font-weight:var(--w);margin:0}
.big{font-size:clamp(20px,2.2vw,30px);line-height:1.25}
.small{font-size:12px}
.dim{color:var(--dim)}
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
@media(max-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:30px;padding-bottom:30px;transition:background-color .35s}
header .grid{align-items:baseline}
.who{grid-column:span 7}.who .face{color:var(--ac);margin-left:1em}.who .role{margin-left:1em}
nav{grid-column:span 5;display:flex;justify-content:flex-end;gap:28px}
nav a[aria-current]{color:var(--ac);text-decoration:none}
@media(max-width:760px){.who{grid-column:span 4}.who .role{display:none}nav{grid-column:span 4;justify-content:flex-start;gap:20px}}

section{padding-top:clamp(56px,10vh,120px);padding-bottom:clamp(56px,10vh,120px)}
.label{grid-column:span 3;color:var(--dim)}
.body{grid-column:4 / span 5}
.side{grid-column:10 / -1}
.wide{grid-column:4 / -1}
@media(max-width:760px){.label,.body,.side,.wide{grid-column:1 / -1}}
p{margin:0 0 1em;max-width:36em}

/* Work 목록 (메인) */
.work{min-height:calc(100vh - 100px);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(40px,8vh,96px)}
.flow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(28px,6vh,64px);margin:0 calc(-1*var(--pad)) clamp(32px,6vh,64px);overflow:hidden;font-size:12px;color:var(--flow,#9c9c9c);user-select:none;white-space:nowrap;word-spacing:1.4em}
/* 방향은 한쪽으로 통일, 줄마다 속도만 조금씩 다르게 */
.flow div span{display:inline-block;animation:flow var(--sp,140s) linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* 커서 표정: 클릭(탭)할 때마다 143개 중 다른 표정으로 바뀐다 */
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:30;font-size:14px;white-space:nowrap;color:var(--ink);transform:translate(-100px,-100px);transition:opacity .2s}
@media(hover:none){.cur{display:none}}
@media(prefers-reduced-motion:reduce){.flow div span{animation:none}body,header{transition:none}}
.index{width:100%;border-collapse:collapse}
.index th{font-weight:var(--w);color:var(--dim);text-align:left;padding:0 12px 12px 0}
.index td{padding:18px 12px 18px 0;border-top:1px solid var(--line);vertical-align:baseline}
.index tr:last-child td{border-bottom:1px solid var(--line)}
.index tr.row{cursor:pointer}.index tr.row:hover td{background:var(--hover)}
.index .no{width:4em}.index .yr{width:6em}.index .fd{width:16em}
.index .t{position:relative}
/* 마우스를 올리면 목록 위 빈 공간에 대표 이미지 */
.thumb{position:absolute;left:0;bottom:calc(100% + 56px);height:min(300px,38vh);width:auto;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2;box-shadow:0 2px 18px rgba(0,0,0,.12)}
.index tr.row:hover .thumb{opacity:1}
.thumbs{display:flex;align-items:flex-end;gap:10px;box-shadow:none}
.thumbs img{width:auto;display:block;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@media(hover:none){.thumb{display:none}}
@media(max-width:760px){.index thead{display:none}.index tr{display:grid;grid-template-columns:2.6em 1fr;border-top:1px solid var(--line);padding:14px 0}.index tr:last-child{border-bottom:1px solid var(--line)}.index td{border:0!important;padding:2px 0}.index td.yr,.index td.fd{grid-column:2;width:auto}.index td.fd{color:var(--dim)}}

/* 프로젝트 상세 */
.hero .big{margin-top:14px;max-width:24em}
.meta{display:grid;grid-template-columns:6.5em 1fr;gap:6px 16px;margin:0;font-size:12px}
.meta dt{color:var(--dim)}.meta dd{margin:0}
.scale{display:flex;align-items:flex-end;gap:clamp(8px,1.6vw,24px);margin-top:clamp(40px,7vh,80px)}
.scale figure{margin:0;display:flex;flex-direction:column;gap:8px}
.scale figcaption{font-size:12px;line-height:1.4}
.ph{width:100%;background:rgba(255,255,255,.03);border:1px dashed #333;display:grid;place-items:center;color:#555;font-size:11px;text-align:center;padding:4px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph.has{border:0;background:none;padding:0}
@media(max-width:760px){.scale figcaption .dim{display:none}}
/* 예시 네 개를 같은 높이로: 가로 폭을 각 이미지 비율만큼 나눠 가짐 */
.case{display:flex;gap:var(--gap);align-items:flex-start}
.case figure{margin:0}.case figcaption{margin-top:10px;font-size:12px}.case figcaption b{display:block;font-weight:var(--w);color:var(--ac)}
@media(max-width:760px){.case{overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding-bottom:8px}.case figure{flex:none!important;scroll-snap-align:start}.case .caseimg{height:300px}.case .caseimg img{height:100%;width:auto}}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:8em 1fr;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
@media(max-width:560px){.steps li{grid-template-columns:1fr;gap:2px}}
.medium .head{grid-column:1 / span 3;position:sticky;top:100px;align-self:start}
.medium .head h3{color:var(--ac)}
.medium .head .dim{margin-bottom:20px}
.medium .imgs{grid-column:4 / -1;display:grid;gap:var(--gap)}
.viewer{aspect-ratio:16/10}
@media(max-width:760px){.medium .head{grid-column:1 / -1;position:static}.medium .imgs{grid-column:1 / -1}}
.ext{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.ext h4{margin:12px 0 4px}
@media(max-width:760px){.ext{grid-template-columns:1fr}}
.ab{margin-bottom:clamp(40px,7vh,72px)}
.ab .steps li{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:760px){.ab .steps li{grid-template-columns:1fr;gap:2px}}
.contact{list-style:none;margin:0;padding:0;display:grid;gap:clamp(20px,3vh,32px)}
.contact li{display:grid;gap:4px;line-height:1.3}
.contact .dim{font-size:12px}
/* 넘겨보기 */
.viewer{outline:none}
.vstage{width:100%;display:flex;justify-content:center}
.book{width:100%;max-width:calc(min(78vh,900px) * var(--pw) / var(--ph) * 2)}
.pg{background:#fff;overflow:hidden}.pg img{width:100%;height:100%;object-fit:cover;display:block}
.pg.blank{background:#f4f4f2}
.vbar{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:16px;font-size:12px}
.vbar button,.lb button{font:inherit;color:inherit;background:none;border:1px solid var(--line);padding:8px 14px;min-height:36px;cursor:pointer}
.vbar button:hover,.lb button:hover{border-color:currentColor}
.vnum{min-width:6em;text-align:center;color:var(--dim)}
/* 펼쳐 놓고 보기 */
.sheets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
@media(max-width:760px){.sheets{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.zoomable{all:unset;cursor:zoom-in;display:block;width:100%;box-sizing:border-box}
.zoomable:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sheets img,.caseimg img,.cards img{width:100%;display:block;background:#fff}
.sheets span{display:block;font-size:12px;color:var(--dim);margin-top:6px}
.caseimg{display:flex;gap:2px}.caseimg img{flex:1;min-width:0}
.cards img[src*='/badge/'],.lbimgs img[src*='/badge/']{border-radius:50%}
.cards{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6px;align-items:start}.cards img{outline:1px solid var(--line)}
/* 확대 창 */
.lb{position:fixed;inset:0;z-index:50;background:#0a0a0a;color:#ededed;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lbtop{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px var(--pad);font-size:12px}
.lbtop .lbnum{margin-right:auto;color:#999}
.lb button{border-color:#444}
.lbimgs{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;gap:2px;padding:0 var(--pad) 40px}
/* 모든 이미지를 같은 높이로 맞춰 보여준다 */
.lbimgs img{height:calc(100vh - 110px);width:auto;max-width:min(48vw,100%);object-fit:contain;flex:0 1 auto;min-width:0}
.lbload{color:#777;font-size:12px;margin-top:20vh}
.lbimgs img:only-child{max-width:100%}
.lbimgs img[src*='/badge/']{border-radius:0;clip-path:circle(50% at 50% 50%)}
.lb.full .lbimgs{justify-content:flex-start}
.lb.full .lbimgs img{height:auto;max-height:none;max-width:none}
.lbprev,.lbnext{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,10,10,.6)!important}
.lbprev{left:12px}.lbnext{right:12px}
@media(max-width:760px){.lbimgs{flex-direction:column;align-items:center}.lbimgs img{width:100%;height:auto;max-width:100%;max-height:none}.lbprev,.lbnext{top:auto;bottom:12px;transform:none}}
.photos figure{margin:0}
.photos img{width:100%;display:block;object-fit:cover}
.slot{border:1px dashed #3a3a3a;display:flex;flex-direction:column;justify-content:space-between;padding:14px;font-size:12px;color:#666}
.slot b{font-weight:var(--w);color:#8a8a8a}
@media(max-width:760px){.photos figure{grid-column:1 / -1!important}}
/* 과정 */
.pmethod{border-top:1px solid var(--line)}
.pmethod{padding:clamp(20px,3.5vh,32px) 0}
.mtitle{font-size:15px;line-height:1.4;color:var(--ink);margin-bottom:10px}
.pmethod p{max-width:40em;font-size:13px;color:var(--dim);margin-bottom:.6em}
/* 01–04는 제목만 보이고, 누르면 펼쳐진다 */
.pstep{border-top:1px solid var(--line)}
.psum{list-style:none;cursor:pointer;padding:clamp(20px,3.5vh,32px) 0;align-items:baseline}
.psum::-webkit-details-marker{display:none}
.psum h3{margin:0!important}
.psum:hover h3{color:var(--ac)}
.ptog{grid-column:-2 / -1;justify-self:end;color:var(--dim);font-size:20px;line-height:1}
.ptog::after{content:'+'}.pstep[open] .ptog::after{content:'−'}
.pbody{padding-bottom:clamp(28px,5vh,48px)}
@media(max-width:760px){.psum{grid-template-columns:2.6em 1fr auto}.psum .label,.psum .body{grid-column:auto}.ptog{grid-column:auto}}
.pstep:last-child{border-bottom:1px solid var(--line)}
.pno{color:var(--ac)}
.pstep h3{margin-bottom:16px}
.ptable{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 4px}
.ptable th{font-weight:var(--w);color:var(--dim);text-align:left;padding:0 10px 8px 0}
.ptable td{padding:10px 10px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.ptable td:first-child{color:var(--ac);white-space:nowrap}
@media(max-width:560px){.ptable thead{display:none}.ptable tr{display:grid;padding:10px 0;border-top:1px solid var(--line)}.ptable td{border:0;padding:2px 0}}
.pimgs{display:flex;gap:var(--gap);align-items:flex-start;margin-top:12px}
.pimgs figure{margin:0}
.pgroup{display:flex;gap:2px}.pgroup img{flex:1;min-width:0;width:100%;display:block;background:#fff}
.pimgs figcaption{font-size:12px;color:var(--dim);margin-top:8px}
.pcap{margin:4px 0 0}
@media(max-width:760px){.pimgs{flex-direction:column}.pimgs figure{flex:none!important;width:100%}}
.next{display:flex;justify-content:space-between;gap:16px;margin-top:64px}
footer{padding-top:30px;padding-bottom:30px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
[hidden]{display:none!important}
</style>
</head>

<script>
{
/* ===== 데이터: 작업을 추가할 때는 PROJECTS 배열에 같은 형식으로 하나 더 넣는다 =====
   img·thumb: null 이면 표시하지 않거나 '이미지 대기' 자리표시. 경로를 넣으면 실제 이미지로 바뀐다.

}];

const FACES=["(o_o)(o-o)(o.o)(ovo)[owo](o~o)(o∧o)(ouo){o3o}(o=o)(oΔº)", "(º_º)(º-º)(º.º)(ºvº)[ºwº](º~º)(ºoº)(ºuº){º3º}(º=º)(ºΔ^)", "(^_^)(^-^)(^.^)(^v^)[^w^](^~^)(^o^)(^u^){^3^}(^=^)(^Δ-)", "(-_-)(-^-)(-.-)(-v-)[-w-](-~-)(-o-)(-u-){-3-}(-=-)(-Δ=)", "(=_=)(=^=)(=.=)(=v=)[=w=](=~=)(=o=)(=u=){=3=}(=n=)(=Δ*)", "(*_*)(*-*)(*.*)(*v*)[*w*](*~*)(*o*)(*u*){*3*}(*=*)(*Δ∂)", "(∂_∂)(∂-∂)(∂.∂)(∂v∂)[∂w∂](∂~∂)(∂o∂)(∂u∂){∂3∂}(∂=∂)(∂Δ+)", "(+_+)(+-+)(+.+)(+v+)[+w+](+~+)(+o+)(+u+){+3+}(+=+)(+Δ<)", "(>_<)(>-<)(>.<)(>v<)[>w<](>~<)(>o<)(>u<){>3<}(>=<)(>ΔT)", "(T_T)(T-T)(T.T)(TvT)[TwT](T~T)(ToT)(TuT){T3T}(T=T)(TΔu)", "(u_u)(u-u)(u.u)(uvu)[uwu](u~u)(uou)(unu){u3u}(u=u)(uΔ³)", "(³_³)(³-³)(³.³)(³v³)[³w³](³~³)(³o³)(³u³){³3³}(³=³)(³Δø)", "(ø_ø)(ø-ø)(ø.ø)(øvø)[øwø](ø~ø)(øoø)(øuø){ø3ø}(ø=ø)(øΔo)"].map(l=>l.match(/[\(\[\{][^\)\]\}]*[\)\]\}]/g));
/* 헤더 표정: 페이지별 눈(명함 대표 표정의 눈) + 입. 링크에 마우스를 올리면 입이 o 로 바뀐다 */
/* 메인 꾸밈: 명함 뒷면 표정 4줄이 한 방향으로 천천히 흐름 (확정) */
const FLOW_ROWS=[0,4,8,12]; /* 4줄 */
const FLOW_SPEED=['140s','170s','155s','185s']; /* 줄별 속도, 방향은 모두 같음 */
const ALL_FACES=FACES.flat();
const EYE={work:['=','u'],project:['*','~'],about:['∂','.'],contact:['*','o']};

/* 페이지별 테마와 표정 (명함 네 장에서) */
const THEME={work:['white','!(=u=)♡'],project:['black','!(*~*)♡'],about:['mint','!(∂.∂)♡'],contact:['pink','!(*o*)♡']};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph=(img,ratio,label)=>`<div class="ph${img?' has':''}" style="aspect-ratio:${ratio}">${img?`<img src="${esc(img)}" alt="${esc(label)}" loading="lazy">`:esc(label)+'<br>이미지 대기'}</div>`;
const dl=rows=>`<dl class="meta">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
const steps=rows=>`<ol class="steps">${rows.map(([a,b])=>`<li><span>${esc(a)}</span><span class="dim">${esc(b)}</span></li>`).join('')}</ol>`;

/* 넘겨보기(책) */
const viewer=m=>`<div class="viewer" data-id="${m.id}" style="--pw:${m.w};--ph:${m.h}">
  <div class="vstage"><div class="book"></div></div>
  <div class="vbar"><button type="button" class="vprev" aria-label="이전 쪽">←</button><span class="vnum">1 / ${m.book.pages.length}</span><button type="button" class="vnext" aria-label="다음 쪽">→</button><button type="button" class="vzoom">크게 보기</button></div></div>`;
/* 펼쳐 놓고 보기(신문 낱면) */
const sheets=m=>{const ps=m.sheets.pages.map(n=>`img/${m.sheets.dir}/${n}.webp`);
  return `<div class="sheets">${ps.map((src,i)=>`<button type="button" class="zoomable" data-lb='${esc(JSON.stringify(ps.map(x=>[x])))}' data-start="${i}" aria-label="${i+1}면 크게 보기"><img src="${esc(src)}" alt="${esc(m.name)} ${i+1}면" loading="lazy" style="aspect-ratio:${m.w}/${m.h}"><span>${i+1}면</span></button>`).join('')}</div>`};

/* 표지 네 장을 실제 크기 비율로: 가장 큰 판형(속속 540mm)을 기준 높이로 */
const thumbCovers=x=>{const H=Math.max(...x.media.map(m=>m.h));
  return `<span class="thumb thumbs" aria-hidden="true">${x.media.map(m=>`<img src="${esc(m.img)}" alt="" loading="lazy" style="height:${(m.h/H*100).toFixed(1)}%;aspect-ratio:${m.w}/${m.h}">`).join('')}</span>`};

/* 실물 · 전시 사진 */
const photosSection=p=>{const list=p.photos.filter(x=>x.src||SHOW_PHOTO_SLOTS);if(!list.length)return'';
  const real=p.photos.filter(x=>x.src).map(x=>[x.src]);
  return `<section class="pad"><div class="grid" style="margin-bottom:24px"><div class="label">실물 · 전시</div></div>
  <div class="grid photos">${list.map(x=>`<figure style="grid-column:span ${x.span}">${x.src
    ?`<button type="button" class="zoomable" data-lb='${esc(JSON.stringify(real))}' data-start="${real.findIndex(r=>r[0]===x.src)}" aria-label="${esc(x.label)} 크게 보기"><img src="${esc(x.src)}" alt="${esc(x.alt||x.label)}" loading="lazy" style="aspect-ratio:${x.ratio}"></button>`
    :`<div class="slot" style="aspect-ratio:${x.ratio}"><span>사진 대기</span><b>${esc(x.label)}</b></div>`}</figure>`).join('')}</div></section>`};

/* 과정 네 구간 */
const processSection=p=>`<section class="pad process"><div class="grid" style="margin-bottom:8px"><div class="label">과정</div></div>
  ${p.method?`<div class="grid pmethod"><div class="label pno">방법론</div><div class="wide"><h3 class="mtitle">${esc(p.methodTitle)}</h3>${p.method.map(t=>`<p>${esc(t)}</p>`).join('')}</div></div>`:''}
  ${p.process.map(st=>{const all=st.imgs.map(g=>g.srcs);let k=0;
  return `<details class="pstep${st.lead?' lead':''}"${st.lead?' open':''}><summary class="grid psum"><span class="label pno">${esc(st.no)}</span><span class="body"><h3 class="big">${esc(st.title)}</h3></span><span class="ptog" aria-hidden="true"></span></summary>
  <div class="grid pbody">
    <div class="body">${st.text.map(t=>`<p>${esc(t)}</p>`).join('')}
      ${st.table?`<table class="ptable"><thead><tr><th>매체</th><th>편집할 때 중심에 둔 질문</th><th>구성 방식</th></tr></thead><tbody>${st.table.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}
      ${st.posture?`<p class="dim small" style="margin-top:20px">읽는 자세 — 네 매체를 읽는 고정 순서는 없다</p>${steps(p.media.map(m=>[m.name+' · '+m.size,m.posture]))}`:''}
      </div>
    ${st.imgs.length?`<div class="wide pimgs">${st.imgs.map(g=>{const start=k;k+=1;const [rw,rh]=g.ratio.split("/").map(Number),w=g.srcs.length*rw/rh;
      return `<figure style="flex:${w.toFixed(3)} 1 0"><button type="button" class="zoomable pgroup" data-lb='${esc(JSON.stringify(all))}' data-start="${start}" aria-label="${esc(g.label||st.title)} 크게 보기">${g.srcs.map(x=>`<img src="${esc(x)}" alt="" loading="lazy" style="aspect-ratio:${g.ratio}">`).join('')}</button>${g.label?`<figcaption>${esc(g.label)}</figcaption>`:''}</figure>`}).join('')}</div>`:''}
    ${st.cap?`<p class="wide dim small pcap">${esc(st.cap)}</p>`:''}
  </div></details>`}).join('')}
</section>`;

function home(){
  return `<section class="work pad">
    <div class="flow" aria-hidden="true">${FLOW_ROWS.map((i,k)=>`<div style="--sp:${FLOW_SPEED[k]}"><span>${(FACES[i].join(' ')+' ').repeat(6)}</span></div>`).join('')}</div>
    <table class="index">
    <thead><tr><th colspan="4">Work (${PROJECTS.length})</th></tr></thead><tbody>
    ${PROJECTS.map(x=>`<tr class="row" data-go="${x.id}" tabindex="0"><td class="no">${esc(x.no)}</td><td class="t big"><a href="#${x.id}">${esc(x.title)}</a>${x.thumb==='covers'?thumbCovers(x):x.thumb?`<img class="thumb" src="${esc(x.thumb)}" alt="" loading="lazy">`:''}</td><td class="yr">${esc(x.year)}</td><td class="fd">${esc(x.field)}</td></tr>`).join('')}
    </tbody></table></section>`;
}

function project(p){
  return `<section class="pad hero">
    <p class="dim">${esc(p.no)} · ${esc(p.year)} · ${esc(p.field)}</p>
    <h1 class="big">《${esc(p.title)}》</h1>
    <div class="scale">${p.media.map(m=>`<figure style="flex:${m.w} 1 0">${ph(m.img,`${m.w}/${m.h}`,m.name+' 표지')}<figcaption>${esc(m.name)} <span class="dim">${esc(m.kind)} · ${esc(m.size)}</span></figcaption></figure>`).join('')}</div>
  </section>
  <section class="pad"><div class="grid"><div class="label">개요</div>
    <div class="body">${p.intro.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <div class="side">${dl(p.info)}</div></div></section>
  <section class="pad"><div class="grid" style="margin-bottom:32px"><div class="label">예시</div>
    <div class="body"><h2 class="big">${esc(p.caseTitle)}</h2><p class="dim" style="margin-top:10px">${esc(p.caseText)}</p></div></div>
    <div class="case">${p.media.map(m=>`<figure style="flex:${(m.caseImg.length*m.w/m.h).toFixed(3)} 1 0"><button class="zoomable caseimg" type="button" data-lb='${esc(JSON.stringify([m.caseImg]))}' aria-label="${esc(m.name)} ${esc(m.casePage)} 크게 보기">${m.caseImg.map(src=>`<img src="${esc(src)}" alt="${esc(m.name)} ${esc(m.casePage)}" loading="lazy" style="aspect-ratio:${m.w}/${m.h}">`).join('')}</button><figcaption><b>${esc(m.name)} · ${esc(m.casePage)}</b>${esc(m.caseNote)}</figcaption></figure>`).join('')}</div></section>
  ${processSection(p)}
  ${p.media.map(m=>`<section class="pad medium" id="${m.id}"><div class="grid">
    <div class="head"><h3 class="big">${esc(m.name)}</h3><div class="dim">${esc(m.kind)}</div>${dl(m.spec)}</div>
    <div class="imgs"><p>${esc(m.desc)}</p>
      ${m.book?viewer(m):m.sheets?sheets(m):''}</div>
  </div></section>`).join('')}
  <section class="pad"><div class="grid"><div class="label">확장</div><div class="wide"><div class="ext">
    ${p.extras.map(e=>`<div>${e.imgs?`<button class="zoomable cards" style="--cols:${e.cols||2}" type="button" data-lb='${esc(JSON.stringify(e.imgs.map(x=>[x])))}' aria-label="${esc(e.name)} 크게 보기">${e.imgs.slice(0,e.show||e.imgs.length).map(x=>`<img src="${esc(x)}" alt="" loading="lazy" style="aspect-ratio:${e.ratio}">`).join('')}</button>`:e.img?ph(e.img,e.ratio,e.name):''}<h4>${esc(e.name)} <span class="dim">${esc(e.kind)}</span></h4><p class="small dim">${esc(e.text)}</p></div>`).join('')}
  </div></div></div></section>
  ${photosSection(p)}
  ${p.retro?`<section class="pad"><div class="grid"><div class="label">회고</div><div class="body">${p.retro.map(t=>`<p>${esc(t)}</p>`).join('')}</div></div></section>`:''}
  <section class="pad"><div class="grid"><div class="label">크레딧</div><div class="body">${dl(p.photoCredit?[...p.credit,['사진',p.photoCredit]]:p.credit)}</div></div>
    <div class="next"><a href="#work">← Work</a><a href="#about">About</a></div></section>`;
}

function about(){
  const block=(label,rows)=>`<div class="grid ab"><div class="label">${label}</div><div class="wide">${steps(rows)}</div></div>`;
  return `<section class="pad"><div class="grid ab"><div class="label">About</div><div class="wide">
      <h1 class="big">${esc(PROFILE.name)}</h1><p>${esc(PROFILE.title)}</p></div></div>
    ${block('Education',PROFILE.education)}
    ${block('Experience',PROFILE.experience)}
    ${block('Exhibition',PROFILE.exhibition)}
    <div class="grid ab"><div class="label">Focus</div><div class="wide"><p>${PROFILE.focus.map(esc).join(' · ')}</p></div></div>
  </section>`;
}

function contact(){
  return `<section class="pad"><div class="grid"><div class="label">Contact</div><div class="body">
    <ul class="contact big">
      <li><span class="dim">Email</span>${esc(PROFILE.email)}</li>
      <li><span class="dim">Instagram</span><a href="https://www.instagram.com/${esc(PROFILE.insta)}/">@${esc(PROFILE.insta)}</a></li>
    </ul>
  </div></div></section>`;
}

const app=document.getElementById('app'),face=document.querySelector('.who .face');
function route(){
  const h=location.hash.slice(1)||'work';
  const p=PROJECTS.find(x=>x.id===h);
  const view=p?'project':(h==='about'||h==='contact')?h:'work';
  app.innerHTML=p?project(p):view==='about'?about():view==='contact'?contact():home();
  if(p)initViewers(p);
  const [theme]=THEME[view];document.body.dataset.theme=theme;curView=view;setFace();
  document.querySelectorAll('nav a[data-v]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===(p?'work':view)));
  window.scrollTo(0,0);
}
let curView='work';
let books=[];
function initViewers(p){
  books.forEach(b=>{try{b.destroy()}catch(e){}});books=[];
  app.querySelectorAll('.viewer').forEach(v=>{
    const m=p.media.find(x=>x.id===v.dataset.id);if(!m||!window.St)return;
    const src=n=>n?`img/${m.book.dir}/${n}.webp`:'';
    const root=v.querySelector('.book');
    root.innerHTML=m.book.pages.map((n,i)=>`<div class="pg${n?'':' blank'}">${n?`<img data-i="${i}" data-src="${src(n)}" alt="${esc(m.name)} ${i+1}">`:''}</div>`).join('');
    const pf=new St.PageFlip(root,{width:m.w*4,height:m.h*4,size:'stretch',minWidth:120,maxWidth:2000,minHeight:160,maxHeight:2400,showCover:true,maxShadowOpacity:.35,flippingTime:700,mobileScrollSupport:false,usePortrait:true,autoSize:true});
    const load=c=>{v.querySelectorAll('img[data-src]').forEach(im=>{const i=+im.dataset.i;if(i>=c-4&&i<=c+6){im.src=im.dataset.src;im.removeAttribute('data-src')}})};
    const num=v.querySelector('.vnum'),total=m.book.pages.length;
    const upd=c=>{num.textContent=`${c+1} / ${total}`;load(c)};
    pf.on('init',e=>upd(e.data.page));pf.on('flip',e=>upd(e.data));
    pf.loadFromHTML(root.querySelectorAll('.pg'));
    v.querySelector('.vprev').onclick=()=>pf.flipPrev();
    v.querySelector('.vnext').onclick=()=>pf.flipNext();
    v.tabIndex=0;v.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){pf.flipNext();e.preventDefault()}if(e.key==='ArrowLeft'){pf.flipPrev();e.preventDefault()}});
    /* 크게 보기: 지금 펼친 면(또는 한 쪽)을 확대 창으로 */
    const spreads=[];const pg=m.book.pages;spreads.push([0]);for(let i=1;i<pg.length-1;i+=2)spreads.push([i,i+1]);spreads.push([pg.length-1]);
    v.querySelector('.vzoom').onclick=()=>{const c=pf.getCurrentPageIndex();const si=Math.max(0,spreads.findIndex(s=>s.includes(c)));
      openLB(spreads.map(s=>s.map(i=>src(pg[i])).filter(Boolean)),si)};
    books.push(pf);
  });
}
/* 확대 창 */
const lb=document.createElement('div');lb.className='lb';lb.hidden=true;lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','크게 보기');
lb.innerHTML='<div class="lbtop"><span class="lbnum"></span><button type="button" class="lbfit">원래 크기</button><button type="button" class="lbclose" aria-label="닫기">닫기</button></div><div class="lbimgs"></div><button type="button" class="lbprev" aria-label="이전">←</button><button type="button" class="lbnext" aria-label="다음">→</button>';
document.body.appendChild(lb);
let lbList=[],lbI=0,lbLast=null;
/* 사진을 다 불러온 뒤에 넣어서, 브라우저(특히 사파리)가 크기를 잘못 잡지 않게 한다 */
let lbToken=0;
const lbShow=()=>{const box=lb.querySelector('.lbimgs'),tok=++lbToken;
  box.innerHTML='<span class="lbload">불러오는 중</span>';
  Promise.all(lbList[lbI].map(s=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r(im);im.src=s}))).then(ims=>{
    if(tok!==lbToken)return;
    box.innerHTML=ims.map(im=>`<img src="${esc(im.src)}" width="${im.naturalWidth}" height="${im.naturalHeight}" alt="">`).join('')});lb.querySelector('.lbnum').textContent=`${lbI+1} / ${lbList.length}`;lb.querySelector('.lbimgs').scrollTo(0,0);
  lb.querySelector('.lbprev').hidden=lbList.length<2;lb.querySelector('.lbnext').hidden=lbList.length<2};
function openLB(list,i=0){lbList=list;lbI=i;lbLast=document.activeElement;lb.classList.remove('full');lb.querySelector('.lbfit').textContent='원래 크기';lb.hidden=false;document.body.style.overflow='hidden';lbShow();lb.querySelector('.lbclose').focus()}
const closeLB=()=>{lb.hidden=true;document.body.style.overflow='';lbLast&&lbLast.focus&&lbLast.focus()};
lb.querySelector('.lbclose').onclick=closeLB;
lb.querySelector('.lbprev').onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;lbShow()};
lb.querySelector('.lbnext').onclick=()=>{lbI=(lbI+1)%lbList.length;lbShow()};
lb.querySelector('.lbfit').onclick=e=>{lb.classList.toggle('full');e.target.textContent=lb.classList.contains('full')?'화면에 맞춤':'원래 크기'};
addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')lb.querySelector('.lbnext').click();if(e.key==='ArrowLeft')lb.querySelector('.lbprev').click()});
app.addEventListener('click',e=>{const z=e.target.closest('.zoomable');if(z){openLB(JSON.parse(z.dataset.lb),+(z.dataset.start||0))}});
const cur=document.createElement('div');cur.className='cur';cur.setAttribute('aria-hidden','true');document.body.appendChild(cur);
let curFace='(=u=)';cur.textContent=curFace;
const nextFace=()=>{let f;do{f=ALL_FACES[Math.floor(Math.random()*ALL_FACES.length)]}while(f===curFace);curFace=f;cur.textContent=f};
const moveCur=(x,y)=>{cur.style.transform=`translate(${x+14}px,${y+14}px)`};
addEventListener('pointermove',e=>{if(e.pointerType==='mouse')moveCur(e.clientX,e.clientY)});
addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;nextFace();moveCur(e.clientX,e.clientY)}); /* 폰·태블릿(터치)에서는 표정 커서 없음 */
const setFace=m=>{const[e,d]=EYE[curView];face.textContent=`!(${e}${m||d}${e})♡`};
app.addEventListener('click',e=>{const r=e.target.closest('tr[data-go]');if(r&&!e.target.closest('a'))location.hash=r.dataset.go});
app.addEventListener('keydown',e=>{const r=e.target.closest('tr[data-go]');if(r&&e.key==='Enter')location.hash=r.dataset.go});
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
